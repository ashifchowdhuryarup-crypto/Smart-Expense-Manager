<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle border glow -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Financial decorative grid / chart rise -->
  <g filter="url(#softShadow)" transform="translate(64, 64)">
    <!-- Base Card / Shield Shape -->
    <rect x="24" y="36" width="336" height="236" rx="32" fill="#1e293b" fill-opacity="0.7" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Accent line -->
    <path d="M 60 210 L 130 160 L 190 190 L 260 110 L 324 70" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Area under curve -->
    <path d="M 60 210 L 130 160 L 190 190 L 260 110 L 324 70 L 324 220 L 60 220 Z" fill="url(#glowGrad)"/>

    <!-- Key Nodes -->
    <circle cx="130" cy="160" r="8" fill="#38bdf8" />
    <circle cx="260" cy="110" r="8" fill="#6366f1" />
    <circle cx="324" cy="70" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3"/>

    <!-- Currency / Taka / Smart Badge -->
    <g transform="translate(192, 170)">
      <circle cx="64" cy="64" r="54" fill="url(#indigoGrad)" filter="url(#softShadow)"/>
      <!-- BDT symbol / Taka ligature representation: stylized ৳ or smart wallet -->
      <path d="M 52 44 L 76 44 M 64 44 L 64 84 C 64 92 56 94 48 90" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="72" cy="60" r="4" fill="#38bdf8"/>
    </g>
  </g>
</svg>
